[project]
name = "tuck-hotkey-generator"
version = "0.1.0"
description = "Generate a transparent hotkey PNG atlas and a compact keycode map."
requires-python = ">=3.12"
dependencies = [
    "pillow>=13.0.0,<14",
]

[project.scripts]
generate = "hotkeys.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hotkeys"
